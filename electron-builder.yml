appId: dev.vigil.mac
productName: Vigil
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - dmg
    - zip
  # Menu-bar only: no Dock icon. Mirrors app.dock.hide() at runtime.
  extendInfo:
    LSUIElement: true
  # Unsigned local builds. Remove `identity: null` once you have a cert.
  identity: null

dmg:
  title: Vigil

electronDist: node_modules/electron/dist
